changelog: |
  - Fixed rejection of clear TVmaze matches with low search-ranking scores.
  - Added safe reuse of TVmaze-verified names for empty-result one-character typo searches.
  - Rotated lookup attempts across scheduled runs to avoid repeatedly excluding shows.
  - Added regression coverage for Happy Faces, Hawaii Flve 0, and the embedded TVmaze checkbox.